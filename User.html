<html>
<head>

    <title>Login Form Design</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css">
    <script type="text/javascript" src="../js/events.js"></script>
    
<body id='userbody'>
    <header>
        <img src="../images/logo.png">
        <h1>CharitAble</h1>
        <nav>
            <a href="home.html" >HOME</a>
            <a href="aboutus.html" >ABOUT US</a>
            <a href="User.html" class="current">LOGIN</a>
            <a href="donatenow.html" >DONATE NOW</a>
        </nav>

    </header>
    <img src="../images/avatar.png" class="avatar">
    <div class="loginbox">
        <form id="userlogin">
            <h1>USER LOGIN</h1>

            <p>Email</p>
            <input type="text" name="" placeholder="Enter Email">
            <p>Password</p>
            <input type="password" name="" placeholder="Enter Password">
            <input type="submit" name="" value="LOGIN">
      <p id="middle">OR</p><br><br><br>
            <input type="button" name="" value="Create an account" onclick="Show()">
            <a href="Admin.html">Are you an Admin?</a><br>      
  
            
        </form>
        <form id="usersignup">
            <h1>USER SIGNUP</h1>
            <p>Email</p>
            <input type="text" name="" placeholder="Enter Email">
            <p>Password</p>
            <input type="password" name="" placeholder="Enter Password">
            <input type="submit" name="" value="SIGNUP">
            <p id="middle">OR</p><br><br><br>
            <input type="button" name="" value="Already have an account" onclick="Hide()">
            <a href="Admin.html">Are you an Admin?</a><br>
        </form> 
    </div>
</body>
</head>
</html>
